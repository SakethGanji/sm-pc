# Lexical branch (§6.5) + shared tokenizer. The tokenizer is deliberately simple
# (lowercase, word regex, 1-2 grams) so it stays exactly reproducible across
# implementations (train vs serve, or a future non-Python server).
tokenizer:
  pattern: "[a-z0-9']+"
tfidf:
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  sublinear_tf: true
  max_vocab: 200000
context:
  agent_tag: "[AGENT]"
  customer_tag: "[CUSTOMER]"
