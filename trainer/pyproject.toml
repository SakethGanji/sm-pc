[project]
name = "semantic-poc-trainer"
version = "0.1.0"
description = "Training pipeline for the intent-classification POC rehearsal (HarperValleyBank)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "google-genai>=1.0",
    "duckdb>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
poc = "semantic_poc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_poc"]
